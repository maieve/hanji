name: iOS Native Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 26.2
      - run: swift --version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Stamp build identity
        env:
          HANJI_SHA: ${{ github.sha }}
          HANJI_RUN_NUMBER: ${{ github.run_number }}
        run: node scripts/stampBuild.mjs
      - run: npx expo prebuild --platform ios --clean --no-install
      - name: Install pods
        working-directory: ios
        run: pod install --repo-update
      - name: Compile unsigned device app
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -workspace Hanji.xcworkspace \
            -scheme Hanji \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee xcodebuild.log
      - name: Package unsigned IPA
        working-directory: ios
        run: |
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          rm -rf Payload Hanji-unsigned.ipa
          mkdir Payload
          ditto "$APP_PATH" "Payload/Hanji.app"
          zip -qry Hanji-unsigned.ipa Payload
          {
            echo "Hanji build"
            echo "commit=${GITHUB_SHA}"
            echo "run=${GITHUB_RUN_ID}"
            echo "workflow_run_number=${GITHUB_RUN_NUMBER}"
            echo "xcode=$(xcodebuild -version | tr '\n' ' ')"
            echo "created_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist" | sed 's/^/version=/'
            /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist" | sed 's/^/build_number=/'
          } > Hanji-build.txt
          node ../scripts/createDeviceChecklist.mjs ../docs/NATIVE_VERIFICATION.md Hanji-device-checklist.md
      - uses: actions/upload-artifact@v4
        with:
          name: Hanji-unsigned-ipa
          path: |
            ios/Hanji-unsigned.ipa
            ios/Hanji-build.txt
            ios/Hanji-device-checklist.md
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-log
          path: ios/xcodebuild.log
